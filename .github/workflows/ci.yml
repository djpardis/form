name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  trigger-deploy:
    name: Trigger private deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Dispatch cloudflare-config deploy
        env:
          DISPATCH_TOKEN: ${{ secrets.CLOUDFLARE_CONFIG_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_CONFIG_DISPATCH_TOKEN is not set; skipping private deploy dispatch."
            exit 0
          fi

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/djpardis/cloudflare-config/dispatches \
            -d "$(node -e 'console.log(JSON.stringify({ event_type: "deploy-form", client_payload: { deployment: "all", source_sha: process.env.GITHUB_SHA } }))')"
