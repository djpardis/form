<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact form example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem auto;
        max-width: 36rem;
      }

      label,
      input,
      textarea,
      button {
        display: block;
        width: 100%;
      }

      label {
        margin-top: 1rem;
      }

      input,
      textarea,
      button {
        box-sizing: border-box;
        font: inherit;
        margin-top: 0.35rem;
        padding: 0.7rem;
      }

      button {
        margin-top: 1rem;
      }

      [role="status"] {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Contact</h1>
    <form data-form method="POST" action="http://localhost:8787/submit/contact">
      <label>
        Email
        <input name="email" type="email" required>
      </label>

      <label>
        Event date
        <input name="eventDate" type="date" required data-date-today-or-future>
      </label>

      <label>
        Message
        <textarea name="message" rows="6" required></textarea>
      </label>

      <input name="website" tabindex="-1" autocomplete="off" hidden>

      <button type="submit">Send</button>
    </form>
    <p data-form-status role="status" aria-live="polite"></p>

    <script>
      const form = document.querySelector("[data-form]");
      const status = document.querySelector("[data-form-status]");
      const dateFields = document.querySelectorAll("[data-date-today-or-future]");

      function todayString() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function setDateMinimums() {
        const today = todayString();

        for (const field of dateFields) {
          field.min = today;
        }
      }

      setDateMinimums();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setDateMinimums();

        if (!form.reportValidity()) {
          return;
        }

        status.textContent = "Sending...";

        try {
          const response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form)
          });

          if (response.ok) {
            form.reset();
            setDateMinimums();
            status.textContent = "Thanks, your message was sent.";
            return;
          }

          const body = await response.json().catch(() => ({}));
          status.textContent = body.error || "Something went wrong. Please try again.";
        } catch {
          status.textContent = "Could not reach the form service. Please try again.";
        }
      });
    </script>
  </body>
</html>
